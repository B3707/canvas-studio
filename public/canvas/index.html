<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canvas Studio</title>
<link rel="stylesheet" href="/shared/studio.css">
</head>
<body>
<div class="shell">
 <header class="top">
  <div class="brandrow"><nav class="nav" id="nav" aria-label="Skills"></nav><h1 id="brand"></h1><p class="sub" id="tag"></p></div>
  <div class="actions"><div class="clock" id="clock"><i>(local)</i><span id="clk"></span></div>
   <div class="seg" role="group" aria-label="Format"><button id="f169" aria-pressed="true">16:9</button><button id="f916" aria-pressed="false">9:16</button></div>
   <button class="btn alt" id="theme" aria-label="Toggle light or dark">Light / dark</button>
   <button class="btn" id="exp">Export MP4 →</button>
  </div>
 </header>
 <div class="work">
  <aside class="gallery"><h2>(templates)</h2><div class="tpls" id="tpls"></div></aside>
  <main class="center">
   <div class="stagewrap" id="wrap"><div class="frame" id="frame"><div id="stage"></div></div></div>
   <div class="tl"><button class="play" id="play" aria-label="Pause"></button><input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Timeline"><output id="time">0.00 / 4.50 s</output></div>
   <div class="msg status" id="emsg" role="status" aria-live="polite"></div>
   <details class="drawer">
    <summary>Save, share and JSON</summary>
    <textarea id="json" readonly aria-label="Template JSON"></textarea>
    <div class="bar" style="margin-top:8px"><button class="btn alt" id="copy">Copy JSON</button><span class="msg" id="cmsg"></span></div>
    <section class="saved">
     <div class="bar"><input type="text" id="sname" placeholder="Template name" aria-label="Template name" style="max-width:240px"><button class="btn" id="save">Save template</button><span class="msg" id="smsg"></span></div>
     <div class="bar" style="margin-top:10px"><button class="btn alt" id="dl">Download JSON file</button><label class="btn alt" for="imp" style="margin:0;cursor:pointer;color:var(--ink)">Import JSON file</label><input type="file" id="imp" accept=".json,application/json" hidden></div>
     <div id="slist" class="bar" style="margin-top:10px"></div>
    </section>
   </details>
  </main>
  <aside class="inspector"><div class="acc"><label for="accent" style="margin-top:0">Accent colour</label><input type="color" id="accent" value="#2148e0"></div><div id="fields"></div></aside>
 </div>
</div>
<script src="/vendor/mp4-muxer.js"></script>
<script src="/shared/lib.js"></script>
<script src="/skills/canvas.js"></script>
<script src="/shared/studio.js"></script>
</body>
</html>
