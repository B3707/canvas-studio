<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Skills Studio</title>
<style>
@font-face{font-family:'DM Sans';font-weight:100 1000;src:url(/fonts/dmsans-var.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Instrument Serif';font-weight:400;font-style:normal;src:url(/fonts/instrumentserif-400.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Instrument Serif';font-weight:400;font-style:italic;src:url(/fonts/instrumentserif-400i.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Inter';font-weight:900;src:url(/fonts/inter-900.woff2) format('woff2');font-display:swap}
:root{--bg:#ebe2d2;--ink:#2d0d01;--mute:#8b6f5f;--line:#d8cab5;--blue:#b4502d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1a0802;--ink:#f0e4cf;--mute:#b0927e;--line:#4b2514;--blue:#d9693f;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.55 'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:28px 28px 60px}
.mark{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;letter-spacing:.02em}
.mark i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--blue);margin-right:9px}
.mark span:last-child{color:var(--mute);font-weight:500}
.hero{padding:clamp(48px,10vh,100px) 0 clamp(44px,8vh,80px)}
h1{font:400 clamp(44px,7.4vw,92px)/.96 'Instrument Serif',Georgia,serif;letter-spacing:-.025em;margin:0;max-width:11ch}
h1 em{color:var(--blue)}
.lead{max-width:430px;color:var(--mute);margin:26px 0 0;font-size:17px}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:56px 1fr 220px;gap:28px;align-items:center;padding:34px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;position:relative;transition:padding .25s}
.row:hover{padding-left:14px}.row:focus-visible{outline:2px solid var(--blue);outline-offset:4px;border-radius:6px}
.num{font-size:13px;color:var(--mute);font-weight:600;align-self:start;padding-top:12px}
.row h2{font:400 clamp(38px,5.4vw,60px)/1 'Instrument Serif',Georgia,serif;margin:0 0 10px;letter-spacing:-.02em}
.row p{margin:0;color:var(--mute);max-width:440px}
.abil{margin-top:14px;font-size:13px;color:var(--mute);max-width:460px;line-height:1.7}.abil b{color:var(--ink);font-weight:600}
.go{display:inline-flex;gap:8px;align-items:center;margin-top:18px;font-weight:700;font-size:14px;color:var(--blue)}.go span{transition:transform .25s}.row:hover .go span{transform:translateX(5px)}
.art{position:relative;overflow:hidden;border-radius:10px;box-shadow:0 22px 50px -22px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.07);justify-self:end;transition:transform .3s}.row:hover .art{transform:translateY(-4px) rotate(-1deg)}
.art.c{width:220px;height:124px;background:#eeecf0}.art.s{width:96px;height:171px;background:#0d0d11}
.foot{margin-top:44px;color:var(--mute);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media (max-width:720px){.row{grid-template-columns:1fr;gap:18px;padding:28px 0}.num{display:none}.art{justify-self:start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark"><span><i></i>Video Skills Studio</span><span>(runs in your browser)</span></div>
  <section class="hero">
    <h1>Templates for <em>beautiful</em> video.</h1>
    <p class="lead">Pick a skill, edit a template, and export an MP4. Every skill has its own look and its own set of designs.</p>
  </section>
  <nav class="rows" id="rows" aria-label="Skills"></nav>
  <div class="foot"><span>Edit live. Export locally. Nothing is uploaded.</span><span>Desktop Chrome or Edge works best for export.</span></div>
</div>
<script src="/shared/lib.js"></script>
<script>
const ART={
 canvas:`<div class="art c" aria-hidden="true"><div style="position:absolute;left:20px;top:22px;font:500 11px 'DM Sans';color:#17171a">There are</div><div style="position:absolute;left:18px;top:30px;font:900 62px/1 Inter,sans-serif;letter-spacing:-.05em;color:#2148e0">four</div><div style="position:absolute;left:62px;top:96px;font:500 11px 'DM Sans';color:#17171a">career patterns</div><div style="position:absolute;left:0;right:0;top:112px;height:5px;background:#2148e0"></div></div>`,
 skylight:`<div class="art s" aria-hidden="true"><div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 22%,#2a2f3b,#0d0d11 75%)"></div><div style="position:absolute;left:27px;top:30px;width:42px;height:56px;border-radius:50%;background:#262b38"></div><div style="position:absolute;left:6px;top:80px;width:84px;height:120px;border-radius:50% 50% 0 0;background:#1b1e27"></div><div style="position:absolute;left:9px;top:113px;font:300 7px 'DM Sans';color:#fff">and we couldn’t</div><div style="position:absolute;left:9px;top:122px;font:700 14px/1 'DM Sans';letter-spacing:-.02em;color:#fff">shut it<br>down</div></div>`};
document.getElementById('rows').innerHTML=SKILLS_INDEX.map((k,i)=>`<a class="row" href="${k.href}"><span class="num">0${i+1}</span><div><h2>${k.name}</h2><p>${k.blurb}</p><div class="abil"><b>${k.abilities.length} templates:</b> ${k.abilities.join(' · ')}</div><span class="go">Open studio <span>→</span></span></div>${ART[k.id]||''}</a>`).join('');
</script>
</body>
</html>
