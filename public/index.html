<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canvas Studio</title>
<style>
:root{--bg:#f4f3f6;--panel:#fff;--ink:#121212;--mute:#6b6670;--line:#dcdae2;--blue:#2148e0;--paper:#eeecf0;--dark:#161818;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101112;--panel:#191a1c;--ink:#eeedf1;--mute:#98939c;--line:#2c2d31;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101112;--panel:#191a1c;--ink:#eeedf1;--mute:#98939c;--line:#2c2d31;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.45 Inter,system-ui,sans-serif}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px;overflow-y:auto}
h1{font:900 20px/1 Inter,sans-serif;letter-spacing:-.03em;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 18px;font-size:13px}
.tpls{display:grid;gap:8px;margin-bottom:20px}
.tpl{all:unset;cursor:pointer;display:block;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.tpl b{display:block;font-weight:600}.tpl span{color:var(--mute);font-size:12px}
.tpl[aria-pressed=true]{border-color:var(--blue);box-shadow:inset 3px 0 0 var(--blue)}
.tpl:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
label{display:block;font-weight:600;font-size:12px;margin:12px 0 4px}
input[type=text],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
textarea{resize:vertical;min-height:84px}
input[type=color]{width:100%;height:34px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:2px}
main{padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:7px 14px;font-weight:600;background:var(--panel)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.btn{all:unset;cursor:pointer;padding:8px 14px;border-radius:8px;background:var(--blue);color:#fff;font-weight:600}
.btn.alt{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.stagewrap{display:flex;justify-content:center;align-items:center;background:repeating-conic-gradient(var(--line) 0 25%,transparent 0 50%) 0 0/16px 16px;border-radius:10px;padding:16px;min-height:300px}
.frame{position:relative;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
.tl{display:flex;gap:10px;align-items:center}
.tl input{flex:1;accent-color:var(--blue)}
.tl output{font-variant-numeric:tabular-nums;color:var(--mute);min-width:84px;text-align:right}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
summary{cursor:pointer;font-weight:600}
#json{font:12px/1.5 ui-monospace,Menlo,monospace;margin-top:10px;min-height:150px}
.saved{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.chip{all:unset;cursor:pointer;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-weight:600}
.chip:hover{border-color:var(--blue)}
h2{font:900 12px/1 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:24px 0 2px}
.rng{display:flex;gap:8px;align-items:center}.rng input{flex:1;accent-color:var(--blue)}.rng output{min-width:36px;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
label.chk{display:flex;gap:8px;align-items:center;font-weight:600;margin:12px 0 4px}
.btn:disabled{opacity:.5;cursor:progress}
#stage.tc *{color:var(--tc)!important}
body.render .app{visibility:hidden}body.render #stage{visibility:visible}body.render{background:#000;overflow:hidden}
.msg{color:var(--mute);font-size:12px}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
/* stage text */
.w{display:inline-block;will-change:filter,opacity}
.big{font-weight:900;letter-spacing:-.045em;line-height:.95}
.serif{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:900;letter-spacing:-.02em}
.sm{font-weight:500;font-size:34px;line-height:1.2}
</style>
</head>
<body>
<div class="app">
<aside>
  <h1>Canvas Studio</h1>
  <p class="sub">Pick a template, edit it, copy it.</p>
  <div class="tpls" id="tpls"></div>
  <div id="fields"></div>
  <label for="accent">Accent colour</label>
  <input type="color" id="accent" value="#2148e0">
</aside>
<main>
  <div class="bar">
    <div class="seg" role="group" aria-label="Format">
      <button id="f169" aria-pressed="true">Long 16:9</button>
      <button id="f916" aria-pressed="false">Short 9:16</button>
    </div>
    <button class="btn alt" id="play">Pause</button>
    <button class="btn alt" id="theme">Theme</button>
    <button class="btn" id="exp">Export MP4</button><span class="msg" id="emsg"></span>
  </div>
  <div class="stagewrap" id="wrap"><div class="frame" id="frame"><div id="stage"></div></div></div>
  <div class="tl"><input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Timeline"><output id="time">0.00 / 4.50 s</output></div>
  <details open>
    <summary>Template JSON</summary>
    <p class="msg">Save this in your repo, or paste it into Claude Code as a beat for the Canvas build.</p>
    <textarea id="json" readonly aria-label="Template JSON"></textarea>
    <div class="bar" style="margin-top:8px"><button class="btn alt" id="copy">Copy JSON</button><span class="msg" id="cmsg"></span></div>
  </details>
  <section class="saved">
    <div class="bar"><input type="text" id="sname" placeholder="Template name" aria-label="Template name" style="max-width:240px"><button class="btn" id="save">Save template</button><span class="msg" id="smsg"></span></div>
    <div class="bar" style="margin-top:10px"><button class="btn alt" id="dl">Download JSON file</button><label class="btn alt" for="imp" style="margin:0;cursor:pointer">Import JSON file</label><input type="file" id="imp" accept=".json,application/json" hidden></div>
    <div id="slist" class="bar" style="margin-top:10px"></div>
  </section>
</main>
</div>
<script src="vendor/mp4-muxer.js"></script>

 if(f.t=='area')return `<textarea id="${id}">${esc(v)}</textarea>`;
 if(f.t=='num')return `<div class="rng"><input type="range" id="${id}" min="${f.min}" max="${f.max}" step="${f.step}" value="${v}"><output id="${id}o">${v}</output></div>`;
 if(f.t=='color')return `<input type="color" id="${id}" value="${v}">`;
 return `<input type="text" id="${id}" value="${esc(v)}">`}
function section(fs,o,pre){return fs.map(f=>{const id=pre+f.k;return f.t=='chk'?`<label class="chk"><input type="checkbox" id="${id}"${o[f.k]?' checked':''}> ${f.l}</label>`:`<label for="${id}">${f.l}</label>${f.h?`<div class="msg">${f.h}</div>`:''}${fld(f,o,id)}`}).join('')}
function wire(f,o,id){const el=$(id);el.oninput=el.onchange=e=>{const t=e.target;o[f.k]=f.t=='chk'?t.checked:f.t=='num'?+t.value:t.value;
 if(f.t=='num')$(id+'o').textContent=t.value;if(f.k=='dur'){D=G.dur;S.t=Math.min(S.t,D)}draw()}}
function buildFields(){const tf=T[S.tpl].fields;
 $('fields').innerHTML='<h2>Template</h2>'+section(tf,S.params,'f_')+'<h2>Style &amp; export</h2>'+section(GF,G,'g_');
 tf.forEach(f=>wire(f,S.params,'f_'+f.k));GF.forEach(f=>wire(f,G,'g_'+f.k))}
function fit(){
 if(document.body.classList.contains('render')){const[W,H]=dims();Object.assign($('stage').style,{position:'fixed',left:'0',top:'0',zIndex:'99',width:W+'px',height:H+'px',transform:'none'});return}
 const [W,H]=dims(),wrapW=$('wrap').clientWidth-32,maxH=Math.max(320,window.innerHeight*0.62);
 const sc=Math.min(wrapW/W,maxH/H,1);
 $('frame').style.width=W*sc+'px';$('frame').style.height=H*sc+'px';
 $('stage').style.width=W+'px';$('stage').style.height=H+'px';$('stage').style.transform=`scale(${sc})`;
}
function draw(){
 const [W,H]=dims(),r=T[S.tpl].draw(S.params,S.t*G.speed,S.accent,W,H);
 const st=$('stage');st.style.background=G.bgOn?G.bg:r.bg;st.style.color=G.tcOn?G.tc:r.color;st.style.fontFamily=FONTS[G.font];
 st.classList.toggle('tc',G.tcOn);st.style.setProperty('--tc',G.tc);
 const ov=(G.vig?'<div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.38) 100%)"></div>':'')+(G.grain?`<div style="position:absolute;inset:0;pointer-events:none;opacity:.2;mix-blend-mode:multiply;background:url('${GRAIN}')"></div>`:'');
 st.innerHTML=`<div style="position:absolute;inset:0;transform:scale(${G.size/100})">${r.html}</div>`+ov;
 $('scrub').value=Math.round(S.t/D*1000);$('time').textContent=S.t.toFixed(2)+' / '+D.toFixed(2)+' s';
 $('json').value=JSON.stringify({canvas_template:S.tpl,format:S.fmt,accent:S.accent,params:S.params,global:G},null,2);
}
let last=performance.now();
function tick(n){const dt=(n-last)/1000;last=n;
 if(S.play){S.t+=dt;if(S.t>D+0.8)S.t=0;if(S.t<=D)draw();else{S.t=Math.min(S.t,D)}}
 requestAnimationFrame(tick)}
function setFmt(f){S.fmt=f;$('f169').setAttribute('aria-pressed',f=='16:9');$('f916').setAttribute('aria-pressed',f!='16:9');fit();draw()}
$('f169').onclick=()=>setFmt('16:9');$('f916').onclick=()=>setFmt('9:16');
$('play').onclick=()=>{S.play=!S.play;$('play').textContent=S.play?'Pause':'Play'};
$('scrub').oninput=e=>{S.play=false;$('play').textContent='Play';S.t=e.target.value/1000*D;draw()};
$('accent').oninput=e=>{S.accent=e.target.value;draw()};
$('theme').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).colorScheme=='dark';r.dataset.theme=d?'light':'dark'};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('json').value);$('cmsg').textContent='Copied.'}catch(e){$('json').select();$('cmsg').textContent='Press Ctrl/Cmd+C to copy.'}};
window.addEventListener('resize',fit);

const FONTFILES=[{fam:'Inter',w:500,st:'normal',src:'fonts/inter-500.woff2'},{fam:'Inter',w:600,st:'normal',src:'fonts/inter-600.woff2'},{fam:'Inter',w:900,st:'normal',src:'fonts/inter-900.woff2'},
 {fam:'Playfair Display',w:900,st:'italic',src:'fonts/playfair-900i.woff2'},{fam:'Space Grotesk',w:500,st:'normal',src:'fonts/spacegrotesk-500.woff2'},{fam:'Space Grotesk',w:700,st:'normal',src:'fonts/spacegrotesk-700.woff2'},{fam:'DM Serif Display',w:400,st:'normal',src:'fonts/dmserif-400.woff2'}];
{const st=document.createElement('style');st.textContent=FONTFILES.map(f=>`@font-face{font-family:'${f.fam}';font-weight:${f.w};font-style:${f.st};src:url(${f.src}) format('woff2');font-display:swap}`).join('');document.head.appendChild(st)}
let SERVER=false;const LS='canvasStudio.templates';
const lsGet=()=>{try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]}};
async function getList(){if(SERVER){try{return await(await fetch('/api/templates')).json()}catch(e){}}return lsGet()}
function applyData(d,name){S.tpl=d.canvas_template;S.fmt=d.format;S.accent=d.accent;resetParams();Object.assign(S.params,d.params);Object.assign(G,d.global||{});D=G.dur;S.t=0;$('accent').value=S.accent;if(name)$('sname').value=name;buildTpls();buildFields();setFmt(S.fmt)}
async function loadList(){const list=await getList();
 $('slist').innerHTML=list.length?list.map((t,i)=>`<button class="chip" data-i="${i}">${esc(t.name)}</button>`).join(''):'<span class="msg">No saved templates yet.</span>';
 $('slist').querySelectorAll('.chip').forEach(b=>b.onclick=()=>applyData(list[b.dataset.i].data,list[b.dataset.i].name))}
$('save').onclick=async()=>{const name=$('sname').value.trim();if(!name){$('smsg').textContent='Give it a name first.';return}
 const item={name,data:JSON.parse($('json').value)};
 try{if(SERVER){const r=await fetch('/api/templates',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(item)});if(!r.ok)throw 0}
  else{const l=lsGet().filter(x=>x.name!==name);l.push(item);localStorage.setItem(LS,JSON.stringify(l))}
  $('smsg').textContent=SERVER?'Saved to templates/ folder.':'Saved in this browser.';loadList()}catch(e){$('smsg').textContent='Could not save.'}};
const saveBlob=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
$('dl').onclick=()=>saveBlob(new Blob([JSON.stringify({name:$('sname').value.trim()||S.tpl,data:JSON.parse($('json').value)},null,2)],{type:'application/json'}),(($('sname').value.trim()||S.tpl).replace(/[^\w-]+/g,'-'))+'.json');
$('imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());applyData(j.data||j,j.name)}catch(x){$('smsg').textContent='Not a valid template file.'}e.target.value=''};

// ---- in-browser MP4 export (used when there is no local server, e.g. on Vercel) ----
const STAGE_CSS=".w{display:inline-block}.big{font-weight:900;letter-spacing:-.045em;line-height:.95}.serif{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:900;letter-spacing:-.02em}.sm{font-weight:500;font-size:34px;line-height:1.2}.tc *{color:var(--tc)!important}";
let FONTCSS='';
async function fontCss(){if(FONTCSS)return FONTCSS;
 const parts=await Promise.all(FONTFILES.map(async f=>{const b=new Uint8Array(await(await fetch(f.src)).arrayBuffer());let x='';for(let i=0;i<b.length;i+=0x8000)x+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));
  return `@font-face{font-family:'${f.fam}';font-weight:${f.w};font-style:${f.st};src:url(data:font/woff2;base64,${btoa(x)}) format('woff2')}`}));
 return FONTCSS=parts.join('')}
function frameSvg(css,W,H){const st=$('stage'),w=document.createElement('div');
 w.setAttribute('xmlns','http://www.w3.org/1999/xhtml');w.className=st.classList.contains('tc')?'tc':'';
 w.style.cssText=`position:relative;overflow:hidden;width:${W}px;height:${H}px;background:${st.style.background};color:${st.style.color};font-family:${st.style.fontFamily};--tc:${G.tc}`;
 w.innerHTML=st.innerHTML;
 return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject width="${W}" height="${H}"><style>${css}</style>${new XMLSerializer().serializeToString(w)}</foreignObject></svg>`}
async function exportInBrowser(m){
 if(!window.VideoEncoder||!window.Mp4Muxer)throw new Error('This browser can’t encode video. Use desktop Chrome or Edge.');
 const [W,H]=dims(),fps=+G.fps||30,total=Math.max(1,Math.round(D*fps)),sc=G.res=='720p'?1:1.5,OW=Math.round(W*sc),OH=Math.round(H*sc);
 m.textContent='Preparing fonts…';const css=STAGE_CSS+await fontCss();
 let cfg=null;for(const [c,k] of [['avc1.640033','avc'],['avc1.64002A','avc'],['avc1.4d0028','avc'],['vp09.00.40.08','vp9']]){
  const conf={codec:c,width:OW,height:OH,bitrate:8e6,framerate:fps};try{if((await VideoEncoder.isConfigSupported(conf)).supported){cfg={conf,k};break}}catch(e){}}
 if(!cfg)throw new Error('No supported video codec in this browser. Try desktop Chrome or Edge.');
 const wasPlay=S.play,t0=S.t;S.play=false;
 const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:cfg.k,width:OW,height:OH},fastStart:'in-memory'});
 let encErr=null;const enc=new VideoEncoder({output:(c,md)=>muxer.addVideoChunk(c,md),error:e=>{encErr=e}});enc.configure(cfg.conf);
 const cv=document.createElement('canvas');cv.width=OW;cv.height=OH;const ctx=cv.getContext('2d');
 try{for(let i=0;i<total;i++){if(encErr)throw encErr;
   S.t=i/fps;draw();
   const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(frameSvg(css,W,H));await img.decode();
   ctx.drawImage(img,0,0,OW,OH);
   const vf=new VideoFrame(cv,{timestamp:Math.round(i*1e6/fps),duration:Math.round(1e6/fps)});enc.encode(vf,{keyFrame:i%(fps*2)==0});vf.close();
   while(enc.encodeQueueSize>6)await new Promise(r=>setTimeout(r,5));
   m.textContent='Rendering '+Math.round((i+1)/total*100)+'%';if(i%3==0)await new Promise(r=>setTimeout(r,0))}
  await enc.flush();if(encErr)throw encErr;muxer.finalize();
  saveBlob(new Blob([muxer.target.buffer],{type:'video/mp4'}),`${S.tpl}-${S.fmt.replace(':','x')}.mp4`);m.textContent='Done. Your MP4 was downloaded.';
 }finally{S.play=wasPlay;S.t=t0;draw()}}
fetch('/api/templates').then(r=>{SERVER=r.ok&&(r.headers.get('content-type')||'').includes('json')}).catch(()=>{}).finally(loadList);
if(location.search.includes('render=1'))document.body.classList.add('render');
resetParams();buildTpls();buildFields();fit();draw();requestAnimationFrame(tick);
window.__load=d=>{document.body.classList.add('render');S.tpl=d.canvas_template;S.fmt=d.format;S.accent=d.accent;resetParams();Object.assign(S.params,d.params);Object.assign(G,d.global||{});D=G.dur;S.play=false;fit();draw()};
window.__frame=t=>{S.t=t;draw()};
const NOSRV='Can’t reach the local server. Open http://localhost:5173 in your browser (not the HTML file), and keep the terminal running npm start.';
if(location.protocol==='file:'){const w=document.createElement('div');w.className='msg';w.style.cssText='color:#c0392b;font-weight:600';w.textContent=NOSRV;document.querySelector('main').prepend(w)}
$('exp').onclick=async()=>{const b=$('exp'),m=$('emsg');if(location.protocol==='file:'){m.textContent=NOSRV;return}b.disabled=true;m.textContent='Starting…';
 if(!SERVER){try{await exportInBrowser(m)}catch(e){m.textContent='Export failed: '+(e&&e.message||e)}b.disabled=false;return}
 try{const r=await fetch('/api/render',{method:'POST',headers:{'Content-Type':'application/json'},body:$('json').value});const j=await r.json();if(!j.id)throw new Error(j.error||'could not start');
  for(;;){await new Promise(x=>setTimeout(x,500));const q=await(await fetch('/api/job?id='+j.id)).json();
   if(q.status=='error')throw new Error(q.error);m.textContent='Rendering '+Math.round(q.progress*100)+'%';
   if(q.status=='done'){m.textContent='Done. Also saved in the exports folder.';const a=document.createElement('a');a.href='/api/video?id='+j.id;a.download='';document.body.appendChild(a);a.click();a.remove();break}}
 }catch(e){m.textContent=e instanceof TypeError?NOSRV:'Export failed: '+e.message}b.disabled=false};
</script>
