<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Skills Studio</title>
<style>
:root{--bg:#f4f3f6;--panel:#fff;--ink:#121212;--mute:#6b6670;--line:#dcdae2;--blue:#2148e0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#101112;--panel:#191a1c;--ink:#eeedf1;--mute:#98939c;--line:#2c2d31;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:56px 22px}
h1{font-size:clamp(34px,6vw,58px);line-height:1;letter-spacing:-.04em;margin:0 0 14px;font-weight:900}
.lead{color:var(--mute);max-width:560px;margin:0 0 40px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.card{display:flex;flex-direction:column;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--blue);transform:translateY(-2px)}.card:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.card h2{margin:0;font-size:28px;letter-spacing:-.03em}.card p{margin:0;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{font-size:12px;font-weight:600;padding:4px 10px;border:1px solid var(--line);border-radius:999px}
.go{margin-top:auto;font-weight:700;color:var(--blue)}
.count{font-size:12px;color:var(--mute);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
</style>
</head>
<body>
<main>
  <h1>Video Skills Studio</h1>
  <p class="lead">Each skill is its own studio with its own look and its own templates. Pick one, edit a template, and export it as an MP4.</p>
  <div class="grid" id="grid"></div>
</main>
<script src="/shared/lib.js"></script>
<script>
document.getElementById('grid').innerHTML=SKILLS_INDEX.map(k=>`<a class="card" href="${k.href}"><span class="count">${k.abilities.length} templates</span><h2>${k.name}</h2><p>${k.blurb}</p><div class="chips">${k.abilities.map(a=>`<span>${a}</span>`).join('')}</div><span class="go">Open ${k.name} studio →</span></a>`).join('');
</script>
</body>
</html>
